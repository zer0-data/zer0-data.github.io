- title: "Dropping the Anchor: Statistical Context Summarization for Distributed Systems via Pulsar Attention"
  authors: "Aryan Sood, Shantanu Acharya, Gaurav Kumar Nayak"
  venue: "EMNLP 2026 Findings"
  venue_detail: "Findings of EMNLP 2026"
  status: accepted
  type: conference
  year: 2026
  highlight: true
  summary: "Developed Pulsar Attention for distributed long-context inference, replacing static anchor duplication with content-aware statistical summaries and reporting up to <strong>4.7%</strong> accuracy gain over dense attention, <strong>6.1%</strong> over Star Attention, and <strong>3.3x</strong> lower Phase-1 FLOPs. Also accepted at the <strong>AdaptFM Workshop</strong> on Resource-Adaptive Foundation Model Inference, ICML 2026."
  demo: pulsar
  demo_caption: "Star Attention prepends a full copy of block 1 to every GPU; Pulsar sends a 64-token sink plus Max-IDF chunks (rare tokens) from earlier blocks, then discards that prefix and merges the query globally."
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2607.20457"
    - label: GitHub
      url: "https://github.com/zer0-data/Statistical-Cross-Attention"
  bibtex: |-
    @misc{sood2026droppinganchorstatisticalcontext,
          title={Dropping the Anchor: Statistical Context Summarization for Distributed Systems via Pulsar Attention},
          author={Aryan Sood and Shantanu Acharya and Gaurav Kumar Nayak},
          year={2026},
          eprint={2607.20457},
          archivePrefix={arXiv},
          primaryClass={cs.CL},
          url={https://arxiv.org/abs/2607.20457},
    }

- title: "More Than a Quick Glance: Overcoming the Greedy Bias in KV-Cache Compression"
  authors: "Aryan Sood, Tanvi Sharma, Vansh Agrawal"
  venue: "ICLR 2026"
  venue_detail: "ICBINB Workshop (I Can't Believe It's Not Better), ICLR 2026"
  status: accepted
  type: workshop
  year: 2026
  summary: "Introduced LASER-KV, a KV-cache compression method achieving up to <strong>10% higher accuracy at 128k context</strong> over greedy pruning baselines via block-wise accumulation and <strong>Exact-LSH sampling</strong>."
  demo: laser
  demo_caption: "Bars show attention scores. Greedy top-k keeps the spikes and drops low-attention supporting facts; LASER-KV protects sink and local tokens (divisor n) and splits the recall budget between exact attention and LSH."
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2602.02199"
    - label: GitHub
      url: "https://github.com/zer0-data/LASER-KV"
  bibtex: |-
    @misc{sood2026quickglanceovercominggreedy,
          title={More Than a Quick Glance: Overcoming the Greedy Bias in KV-Cache Compression},
          author={Aryan Sood and Tanvi Sharma and Vansh Agrawal},
          year={2026},
          eprint={2602.02199},
          archivePrefix={arXiv},
          primaryClass={cs.AI},
          url={https://arxiv.org/abs/2602.02199},
    }

- title: "Lost in Interpolation: Why Predictive Feedback Fails in Diffusion Language Models"
  authors: "Lavanya Nigam, Ishaan Bansal, Aryan Sood, Vidit Aggarwal, Gaurav Kumar Nayak"
  venue: "COLM 2026"
  venue_detail: "Non-Autoregressive Language Models Workshop, COLM 2026"
  status: accepted
  type: workshop
  year: 2026
  summary: "Introduced spherical soft-masking for diffusion LLMs, replacing Euclidean LERP feedback with <strong>SLERP over Fréchet means</strong> to mitigate embedding norm collapse during MDLM fine-tuning."
  demo: lostinterp
  demo_caption: "The mask and predicted-token embeddings sit ~73° apart on a hypersphere. LERP feedback cuts through the sphere and shrinks the norm; Spherical Soft-Masking takes a Fréchet mean and SLERPs along the surface."
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2608.06529"
    - label: GitHub
      url: "https://github.com/zer0-data/Soft-Masked-DLLMs"
  bibtex: |-
    @misc{nigam2026lostinterpolationpredictivefeedback,
          title={Lost in Interpolation: Why Predictive Feedback Fails in Diffusion Language Models},
          author={Lavanya Nigam and Ishaan Bansal and Aryan Sood and Vidit Aggarwal and Gaurav Kumar Nayak},
          year={2026},
          eprint={2608.06529},
          archivePrefix={arXiv},
          primaryClass={cs.CL},
          url={https://arxiv.org/abs/2608.06529},
    }

- title: "Don't Look Up (Every Token): Escaping Quadratic Complexity via Patterns and Algorithms"
  authors: "Aryan Sood, Tanvi Sharma, Vansh Agrawal"
  venue: "ICLR 2026"
  venue_detail: "ICLR 2026 Blogpost Track"
  status: accepted
  type: blog
  year: 2026
  summary: "Surveyed sparsity-based efficiency methods for transformers, organizing them into a unified taxonomy distinguishing <strong>static structural patterns</strong> from <strong>dynamic, attention-driven</strong> approaches."
  demo: sparsity
  demo_caption: "Causal attention masks for a 20-token sequence. Static patterns fix the mask in advance; dynamic ones pick keys from the content, so the mask changes with the input."
  links:
    - label: Blog
      url: "https://iclr-blogposts.github.io/2026/blog/2026/sparsity/"
  bibtex: |-
