# Publications — edit this file to update the Publications page and the home page.
#
# Fields
#   title        Paper title
#   authors      Comma-separated; "Aryan Sood" is bolded automatically
#   note         Optional small line under the authors (e.g. equal-contribution marks)
#   venue        Short label, e.g. "ICLR 2026"
#   venue_detail Optional longer venue line, e.g. "AdaptFM Workshop, ICML 2026"
#   status       accepted | review | preprint | upcoming
#   type         conference | workshop | blog | preprint   (drives the filter chips)
#   year         Year shown on the card
#   highlight    true marks a headline paper (accent badge, listed first)
#   summary      One or two sentences (HTML allowed)
#   links        List of { label, url }
#   bibtex       Optional BibTeX block (use the | literal style). Use the official
#                arXiv export (arxiv.org/bibtex/<id>) where one exists.
#   demo         Name of an interactive explainer in assets/js/demos.js (optional)
#   demo_caption Caption shown under the explainer
#   placeholder  true renders a "forthcoming" card. To publish a placeholder,
#                fill in the fields and delete the placeholder line.

