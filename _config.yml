title: Aryan Sood
author: Aryan Sood
email: aryan_s2@ee.iitr.ac.in
phone: "+91-7838668881"
location: "Gurugram, Haryana, India"
description: >- # this means to ignore newlines until "baseurl:"
  Aryan Sood — Electrical Engineering undergraduate at IIT Roorkee researching efficient
  long-context LLM inference, sparse attention, KV-cache compression, and diffusion language models.
url: "https://zer0-data.github.io" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) and \[ \] delimiters, rendered client-side by KaTeX

# Paper summaries / blog posts live in _blogs/ and render at /blogs/<name>/
collections:
  blogs:
    output: true
    permalink: /blogs/:name/

# Publish posts dated "today" even when GitHub builds in UTC before the date rolls over.
future: true

defaults:
  - scope:
      path: ""
      type: blogs
    values:
      layout: blog

# Primary navigation (order matters)
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications.html
  - title: Experience
    url: /experience.html
  - title: Projects
    url: /projects.html
  - title: Blogs
    url: /blogs.html
  - title: About
    url: /about.html

social:
  - label: GitHub
    url: https://github.com/zer0-data
    icon: fab fa-github
  - label: LinkedIn
    url: https://linkedin.com/in/aryan-sood-05052k06
    icon: fab fa-linkedin-in
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=P66NEf0AAAAJ&hl=en&oi=sra
    icon: fas fa-graduation-cap

# Exclude files/folders from the build
exclude:
  - README.md
